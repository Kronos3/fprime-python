####
# check.yml:
#
# Static checks for the autocoder. mypy runs in strict mode against fprime-fpp-python's type stubs, which is
# what makes a rename in the FPP model a build failure here rather than a crash in a project's build.
#
# The oldest and newest supported interpreters are both run: mypy itself checks against the language version
# pinned in pyproject.toml either way, so what the pair adds is that the dependencies still resolve on both.
####
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: mypy (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm reads the version from the tags
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run mypy
        run: python -m mypy
